[project]
name = "lut-builder"
version = "0.1.0"
description = "Generate diagnostic false-color scene-exposure LUTs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colour-science>=0.4.7",
    "numpy>=2.2.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
# This is what makes `uv run lut-builder` work.
# It points directly to the Typer app object in cli.py.
lut-builder = "lut_builder.cli:app"

[build-system]
# uv uses hatchling by default. This block tells it how to find
# and build the package from the src/ layout.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lut_builder"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Install the colour-science warning filter before importing the package.
"src/lut_builder/cli.py" = ["E402"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]
