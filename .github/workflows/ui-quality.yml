name: UI quality

on:
  workflow_call:
    inputs:
      update_snapshots:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:ui
      - run: pnpm test:ui ${{ inputs.update_snapshots && '--update-snapshots=changed' || '' }}
      - name: Upload Linux screenshot candidates
        if: inputs.update_snapshots
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-candidates
          path: frontend/tests/ui/screenshots/
      - name: Upload UI report, screenshot differences and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-quality-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
