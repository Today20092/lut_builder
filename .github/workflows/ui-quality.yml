name: UI quality

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      suite:
        description: Run the full gate or capture canonical visual states only
        type: choice
        default: all
        options: [all, visual]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:ui
      - name: Run UI quality suite
        env:
          UI_SUITE: ${{ inputs.suite || 'all' }}
          UI_SHARD: ${{ matrix.shard }}/3
        run: |
          if [ "$UI_SUITE" = visual ]; then
            pnpm test:ui --grep '@visual' --shard="$UI_SHARD"
          else
            pnpm test:ui --shard="$UI_SHARD"
          fi
      - name: Upload UI report, screenshot differences and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-quality-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
