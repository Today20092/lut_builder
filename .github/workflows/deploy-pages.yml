name: GitHub Pages

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: ./.github/workflows/python.yml

  ui:
    uses: ./.github/workflows/ui-quality.yml

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.3"
          python-version: "3.12"
      - run: uv sync --locked --project ..
      - run: pnpm test
      - run: pnpm build
        env:
          LUT_BUILDER_PAGES: "true"
      - name: Install browser acceptance tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-save playwright@1.61.1
          node "$RUNNER_TEMP/browser-check/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
      - name: Check static browser workflows
        env:
          LUT_BUILDER_PAGES: "true"
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/lut_builder/ > /dev/null; then break; fi
            sleep 1
          done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-check/node_modules/playwright/index.mjs"
          for browser in chromium firefox webkit; do
            BROWSER="$browser" node tests/browser-only.mjs
            BROWSER="$browser" node tests/manual-browser.mjs
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/lut_builder/static

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, python, ui]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
