name: Python checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media test tools
        run: |
          if ! command -v ffmpeg > /dev/null || ! command -v ffprobe > /dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.3"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare browser LUTs with Python
        run: node --experimental-strip-types --test frontend/tests/python-parity.mjs frontend/tests/imported-lut-parity.mjs
