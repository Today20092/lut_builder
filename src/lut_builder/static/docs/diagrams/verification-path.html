<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From camera samples to the screen</title>
<style>
  :root { color-scheme: light dark; --paper: #f7f7f7; --card: #fff; --ink: #171717; --muted: #666; --rule: #d4d4d4; }
  @media (prefers-color-scheme: dark) { :root { --paper: #171717; --card: #262626; --ink: #fafafa; --muted: #b3b3b3; --rule: #525252; } }
  * { box-sizing: border-box; } body { margin: 0; background: var(--paper); color: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
  .diagram-container { width: 100%; overflow-x: auto; } .diagram-container:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; }
  svg { display: block; width: 100%; min-width: 720px; } text { fill: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
  .node { fill: var(--card); stroke: var(--muted); } .name { font-size: 16px; font-weight: 600; } .sub { fill: var(--muted); font-size: 12px; } .arrow { stroke: var(--muted); stroke-width: 2; fill: none; }
  @media print { .diagram-container { overflow: visible; } svg { min-width: 0; } }
</style>
<div class="diagram-container" tabindex="0" role="region" aria-label="Verification path diagram; scroll horizontally on narrow screens" data-pagefind-ignore>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="verification-path-title verification-path-desc">
  <title id="verification-path-title">From camera samples to the screen</title>
  <desc id="verification-path-desc">Confirmed source RGB is sampled through the exact serialized cube with tetrahedral interpolation, then converted to an SDR view; source RGB, LUT output RGB, and display RGB are distinct inspection stages.</desc>
  <defs><marker id="verification-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="var(--muted)"/></marker></defs>
  <text x="24" y="40" font-size="24" font-weight="600">From camera samples to the screen</text>
  <text x="24" y="64" class="sub">Confirm the source interpretation before running this path</text>
  <g class="arrow" marker-end="url(#verification-arrow)"><path d="M224 148 H256"/><path d="M460 148 H492"/></g>
  <rect class="node" x="24" y="100" width="200" height="96" rx="6"/>
  <text x="40" y="128" class="sub">01 · SOURCE RGB</text><text x="40" y="152" class="name">Camera samples</text><text x="40" y="176" class="sub">Original-resolution pixels</text>
  <rect x="264" y="100" width="196" height="96" rx="6" fill="var(--ink)"/>
  <text x="280" y="128" class="sub" style="fill:var(--paper)">02 · LUT OUTPUT RGB</text><text x="280" y="152" class="name" style="fill:var(--paper)">Serialized cube</text><text x="280" y="176" class="sub" style="fill:var(--paper)">Tetrahedral interpolation</text>
  <rect class="node" x="500" y="100" width="196" height="96" rx="6"/>
  <text x="516" y="128" class="sub">03 · DISPLAY RGB</text><text x="516" y="152" class="name">SDR screen view</text><text x="516" y="176" class="sub">Range + transfer + primaries</text>
  <path d="M24 232 H696" stroke="var(--rule)"/>
  <text x="24" y="256" class="sub">Arrows show processing order. Filled step uses the checked cube's exact bytes.</text>
  <text x="24" y="280" class="sub">Retain the checked cube and provenance hash. No tone mapping or recovery.</text>
</svg>
</div>
</html>
