<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>LUT Builder</title>
    <meta name="description" content="Create free diagnostic false-color exposure LUTs for your camera. Set exposure bands and colors, then export a .cube file on your device." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="LUT Builder" />
    <meta property="og:description" content="Create free diagnostic false-color exposure LUTs for your camera, in your browser." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <noscript>LUT Builder needs JavaScript and Web Workers for on-device generation. Enable JavaScript in a current browser, or use the Python CLI.</noscript>
    <div id="root"></div>
    <script>
      if (typeof __TOKEN__ !== "undefined") window.LUT_BUILDER_TOKEN = __TOKEN__;
      if (typeof __SETUP__ !== "undefined") window.LUT_BUILDER_SETUP = __SETUP__;
      if (typeof __CATALOG__ !== "undefined") window.LUT_BUILDER_CATALOG = __CATALOG__;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
